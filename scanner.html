<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Сканер МИРЭА</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; margin: 0; background: var(--tg-theme-bg-color, #111); color: var(--tg-theme-text-color, #fff);
    }
    button {
      padding: 14px 28px; font-size: 16px; border: none; border-radius: 12px;
      background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button onclick="openScanner()">Открыть сканер</button>
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    function openScanner() {
      tg.showScanQrPopup({ text: "Наведи на QR-код в Пульсе МИРЭА" }, (qrText) => {
        if (qrText) {
          tg.closeScanQrPopup();
          tg.sendData(qrText);
          return true;
        }
      });
    }
    openScanner();
  </script>
</body>
</html>
